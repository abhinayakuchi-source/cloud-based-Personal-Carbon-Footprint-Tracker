<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | CarbonTrack</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Your CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #f4f8f5;
        }

        .register-container {
            max-width: 850px;
            margin: 50px auto;
        }

        .register-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .brand {
            color: #198754;
            font-weight: 700;
            font-size: 30px;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-register {
            background: #198754;
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 10px;
        }

        .btn-register:hover {
            background: #146c43;
        }

        .login-link {
            color: #198754;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="container register-container">

    <div class="register-card">

        <!-- Header -->
        <div class="text-center mb-4">

            <div class="brand">
                CarbonTrack
            </div>

            <h2 class="mt-2">
                Create Your Account
            </h2>

            <p class="text-muted">
                Start tracking and reducing your carbon footprint.
            </p>

        </div>

        <!-- Registration Form -->
        <form id="registerForm">

            <div class="row">

                <!-- Full Name -->
                <div class="col-md-6 mb-3">

                    <label for="fullName" class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="col-md-6 mb-3">

                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Age -->
                <div class="col-md-6 mb-3">

                    <label for="age" class="form-label">
                        Age
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="age"
                        placeholder="Enter your age"
                        min="1"
                        required
                    >

                </div>


                <!-- Gender -->
                <div class="col-md-6 mb-3">

                    <label for="gender" class="form-label">
                        Gender
                    </label>

                    <select
                        class="form-select"
                        id="gender"
                        required
                    >

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Other">
                            Other
                        </option>

                        <option value="Prefer not to say">
                            Prefer not to say
                        </option>

                    </select>

                </div>


                <!-- Household Size -->
                <div class="col-md-6 mb-3">

                    <label for="householdSize" class="form-label">
                        Household Size
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="householdSize"
                        placeholder="Number of people"
                        min="1"
                        required
                    >

                </div>


                <!-- Location -->
                <div class="col-md-6 mb-3">

                    <label for="location" class="form-label">
                        Location
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="location"
                        placeholder="Example: Chennai"
                        required
                    >

                </div>


                <!-- Occupation -->
                <div class="col-md-6 mb-3">

                    <label for="occupation" class="form-label">
                        Occupation
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="occupation"
                        placeholder="Example: Student"
                        required
                    >

                </div>


                <!-- Transport -->
                <div class="col-md-6 mb-3">

                    <label for="transportPreference" class="form-label">
                        Preferred Transport
                    </label>

                    <select
                        class="form-select"
                        id="transportPreference"
                        required
                    >

                        <option value="">
                            Select Transport
                        </option>

                        <option value="Public Transport">
                            Public Transport
                        </option>

                        <option value="Car">
                            Car
                        </option>

                        <option value="Bike">
                            Bike
                        </option>

                        <option value="Walking">
                            Walking
                        </option>

                        <option value="Mixed">
                            Mixed
                        </option>

                    </select>

                </div>


                <!-- Monthly Goal -->
                <div class="col-md-6 mb-3">

                    <label for="monthlyGoal" class="form-label">
                        Monthly Carbon Goal (kg CO₂e)
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="monthlyGoal"
                        placeholder="Example: 150"
                        min="0"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="col-md-6 mb-3">

                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="col-md-6 mb-3">

                    <label for="confirmPassword" class="form-label">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>

            </div>


            <!-- Terms -->
            <div class="form-check mb-4">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="terms"
                    required
                >

                <label
                    class="form-check-label"
                    for="terms"
                >
                    I agree to the Terms and Privacy Policy.
                </label>

            </div>


            <!-- Register Button -->
            <button
                type="submit"
                class="btn btn-register btn-success w-100"
            >
                Create Account
            </button>

        </form>


        <!-- Login -->
        <div class="text-center mt-4">

            <span class="text-muted">
                Already have an account?
            </span>

            <a
                href="login.html"
                class="login-link"
            >
                Login
            </a>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<!-- CarbonTrack Authentication JS -->
<script src="js/auth.js"></script>

</body>
</html>
